<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Midnightaffair – introductions, arranged by a real team</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8fb;--ink:#1f2937;--mu:#5b6676;--card:#fff;--ln:#e3e8ef;--acc:#d6336c;--on:#fff;--soft:#fdecf2;--ok:#0f766e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


*{box-sizing:border-box}html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Sora,system-ui,sans-serif;font-weight:700;line-height:1.12;letter-spacing:-.02em;margin:0 0 .4em}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--ln)}
header a{color:var(--ink);text-decoration:none;font-weight:600}.logo{font-family:Sora,sans-serif;font-size:22px;font-weight:700}
main{max-width:1120px;margin:0 auto;padding:24px 20px 60px}
.hero{padding:34px 0 4px;max-width:700px}.hero h1{font-size:clamp(36px,7vw,60px)}
.pill{display:inline-block;background:var(--soft);color:var(--acc);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600;margin-bottom:14px}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 24px}.fl button{border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.fl button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pc{background:var(--card);border-radius:22px;overflow:hidden;border:1px solid var(--ln);box-shadow:0 10px 28px -14px rgba(30,20,60,.35);display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--soft)}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph:after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,rgba(10,6,24,.8))}
.ov{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;color:#fff}.ov h3{margin:0;font-size:22px}.ov p{margin:2px 0 0;opacity:.85;font-size:14px}
.vf{position:absolute;top:12px;left:12px;z-index:1;background:rgba(255,255,255,.94);color:#0f766e;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px}
.pb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}.pb p{margin:0;color:var(--mu);font-size:14px}.pb .btn{margin-top:auto;width:100%;border-radius:12px;padding:12px}
.tg span{display:inline-block;background:var(--soft);color:var(--acc);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}
@media(prefers-reduced-motion:no-preference){.ph img{transition:transform .4s}.pc:hover img{transform:scale(1.05)}}.mu{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.card p{margin:0}.card .btn{margin-top:auto}
.av{width:54px;height:54px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center;font:600 24px Sora,sans-serif}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:10px;padding:10px 14px;font:600 15px inherit;font-family:inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ln)}.btn.sm{padding:5px 10px;font-size:13px}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;width:100%}
.note{background:var(--soft);border:1px solid var(--ln);border-radius:10px;padding:10px 14px;font-size:14px;margin:10px 0}
.thread{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.b{max-width:80%;padding:8px 12px;border-radius:12px;background:var(--bg);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.b.me{align-self:flex-end;background:var(--acc);color:var(--on)}.b small{display:block;opacity:.85;font-size:11px;margin-bottom:2px}.b.ag{background:#2b73e0;color:#fff}
header{flex-wrap:wrap;gap:8px}nav{display:flex;gap:22px;align-items:center;font-size:14px}nav a{padding:6px 0}
.mb{display:none;width:44px;height:44px;border:1px solid var(--ln);background:var(--card);border-radius:12px;cursor:pointer;padding:0;position:relative}
.mb span,.mb span:before,.mb span:after{content:"";position:absolute;width:18px;height:2px;background:var(--ink);border-radius:2px;transition:transform .2s,top .2s}
.mb span{left:12px;top:20px}.mb span:before{left:0;top:-6px}.mb span:after{left:0;top:6px}
header.open .mb span{background:transparent}header.open .mb span:before{top:0;transform:rotate(45deg)}header.open .mb span:after{top:0;transform:rotate(-45deg)}
@media(max-width:700px){.mb{display:block}nav{display:none;flex-basis:100%;flex-direction:column;align-items:stretch;gap:0;border-top:1px solid var(--ln);margin-top:6px}header.open nav{display:flex}nav a{padding:14px 4px;border-bottom:1px solid var(--ln);font-size:16px}nav a:last-child{border-bottom:0}}
.pg{max-width:680px}.pg h1{font-size:clamp(30px,5vw,44px)}.pg p,.pg li{margin:0 0 12px}.pg ol,.pg ul{padding-left:22px}
.send{display:flex;gap:8px;margin-top:10px}
dialog{border:1px solid var(--ln);border-radius:14px;background:var(--card);color:var(--ink);max-width:440px;padding:22px}
dialog::backdrop{background:rgba(0,0,0,.5)}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.chk{display:flex;gap:8px;align-items:flex-start}.chk input{width:auto;margin-top:5px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tabs .on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.inbox{display:grid;grid-template-columns:260px 1fr;gap:14px}
@media(max-width:700px){.inbox{grid-template-columns:1fr}}
.li{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:8px;color:var(--ink);font:inherit;cursor:pointer}
.li.sel{border-color:var(--acc)}.li small{display:block;color:var(--mu)}
.chip{font-size:12px;border:1px solid var(--ln);border-radius:99px;padding:1px 8px;color:var(--mu)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--ln);border-radius:12px;overflow:hidden}
td,th{padding:9px 10px;border-bottom:1px solid var(--ln);text-align:left;font-size:14px}.sc{overflow-x:auto}
form.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:16px}form.add textarea{grid-column:1/-1}
footer{margin-top:28px;background:var(--card);border-top:1px solid var(--ln);text-align:center;padding:24px 20px;font:600 17px Sora,system-ui,sans-serif;color:var(--ink)}footer:before{content:"✓ ";color:var(--ok)}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--acc)}}
</style></head><body>
<header><a href="#/" class="logo">Midnightaffair</a><button class="mb" id="mb" aria-label="Menu" aria-expanded="false" aria-controls="nv" onclick="menu()"><span></span></button><nav id="nv"><a href="#/how">How it works</a><a href="#/about">About us</a><a href="#/disclaimer">Disclaimers</a></nav></header>
<main id="app"></main>
<footer>No signup needed.</footer>
<dialog id="dlg"><h2>Before you chat</h2>
<p>Chats are handled by the Midnightaffair concierge team, who reply on behalf of <b id="dn"></b> and arrange introductions. You are not messaging her directly.</p>
<label class="chk"><input type="checkbox" id="ok"><span>I’m 18 or older and I understand this.</span></label>
<div id="ts"></div><p id="de" class="mu" style="color:var(--acc)"></p>
<div class="row"><button class="btn ghost" onclick="dlg.close()">Cancel</button><button class="btn" onclick="go()">Start chat</button></div></dialog>
<script>
const K='ml:v1',PIN='1234',$=i=>document.getElementById(i),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const L=(id,n,a,c,t,b,v)=>({id,name:n,age:a,city:c,tag:t,bio:b,av:v,cons:v,live:v});
const seed=()=>({l:[L('l1','Amara',34,'Lagos','Relationship','Warm and funny. Loves live music and long dinners.',1),
L('l2','Ngozi',47,'Abuja','Relationship','Business owner looking for a steady, kind partner.',1),
L('l3','Folake',52,'Ibadan','Hookup','Retired teacher who enjoys travel, cooking and good conversation.',1),
L('l4','Zainab',29,'Port Harcourt','Hookup','Easygoing and social. Weekends by the water.',1),
L('l5','Bisi',41,'Lagos','Relationship','Awaiting verification.',0)],c:[],m:[]});
let sb=null,cfg={},S={l:[],c:[],m:[]},me,uidv=null,adm=0,tab='in',sel=null,flt='all',want,ch=null,tk='',tsid,rt;
try{me=localStorage.getItem('ml:me');if(!me){me='Guest-'+uid().slice(0,4);localStorage.setItem('ml:me',me)}}catch(e){me='Guest-'+uid().slice(0,4)}
const R=()=>location.hash.slice(1).split('/').filter(Boolean);
const lname=id=>(S.l.find(x=>x.id==id)||{}).name||'?';
const last=c=>S.m.filter(m=>m.c==c.id).slice(-1)[0];
const now=()=>new Date().toISOString();
/* ---- data layer: Supabase when configured, browser demo otherwise ---- */
const fL=r=>({id:r.id,name:r.display_name,age:r.age,city:r.city||'',tag:r.tag||'',bio:r.bio||'',img:(r.photo_urls||[])[0]||'',av:r.age_verified_at?1:0,cons:r.consent_recorded_at?1:0,live:r.status=='live'?1:0,avt:r.age_verified_at,ct:r.consent_recorded_at});
const fC=r=>({id:r.id,cid:'Guest '+r.client_id.slice(0,4),lid:r.listing_id,st:r.status});
const fM=r=>({id:r.id,c:r.conversation_id,r:r.sender_role,b:r.body,t:Date.parse(r.created_at)});
async function ld(){
 if(!sb){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||seed();S.l.forEach(l=>{if(l.tag=='Companionship')l.tag='Hookup'});return}
 let q=sb.from('listings').select('*').order('created_at');if(!adm)q=q.eq('status','live');
 const [l,c,m]=await Promise.all([q,sb.from('conversations').select('*'),sb.from('messages').select('*').order('created_at')]);
 S={l:(l.data||[]).map(fL),c:(c.data||[]).map(fC),m:(m.data||[]).map(fM)}}
const sv=()=>{if(sb)return;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
function live(){if(!sb||ch)return;ch=sb.channel('ml').on('postgres_changes',{event:'*',schema:'public',table:'messages'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'conversations'},refresh).subscribe()}
const rd=(f,blob)=>new Promise(r=>{if(!f)return r(blob?null:'');const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const W=480,H=600,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),k=Math.max(W/i.width,H/i.height),w=i.width*k,h=i.height*k;x.drawImage(i,(W-w)/2,(H-h)/2,w,h);blob?c.toBlob(r,'image/jpeg',.8):r(c.toDataURL('image/jpeg',.8))};i.onerror=()=>r(blob?null:'');i.src=fr.result};fr.readAsDataURL(f)});
async function up(f){const b=await rd(f,1);if(!b)return '';const p=uid()+uid()+'.jpg',{error}=await sb.storage.from('photos').upload(p,b,{contentType:'image/jpeg'});if(error){alert(error.message);return ''}return sb.storage.from('photos').getPublicUrl(p).data.publicUrl}
/* ---- homepage ---- */
const hue=n=>[...n].reduce((a,c)=>a+c.charCodeAt(0),0)*47%360;
const ph=l=>{const h=hue(l.name),g=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 500'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${h},70%,62%)'/><stop offset='1' stop-color='hsl(${(h+50)%360},65%,32%)'/></linearGradient></defs><rect width='400' height='500' fill='url(#g)'/><circle cx='200' cy='190' r='62' fill='rgba(255,255,255,.35)'/><ellipse cx='200' cy='400' rx='130' ry='110' fill='rgba(255,255,255,.35)'/></svg>`;return 'data:image/svg+xml,'+encodeURIComponent(g)};
function home(){const all=S.l.filter(l=>l.live&&l.av&&l.cons),tags=[...new Set(all.map(l=>l.tag))],ls=all.filter(l=>flt=='all'||l.tag==flt);
$('app').innerHTML=`<section class="hero"><span class="pill">Welcome to Midnightaffair</span><h1>Here are our available ladies.</h1><p class="mu">Every lady is verified. Choose the one you’d like to meet and our concierge team will chat with you and arrange the introduction.</p></section>
<div class="fl">${['all',...tags].map(t=>`<button class="${flt==t?'on':''}" onclick="flt='${esc(t)}';home()">${t=='all'?'All ('+all.length+')':esc(t)}</button>`).join('')}</div>
<div class="grid">${ls.map(l=>`<article class="pc"><div class="ph"><img src="${esc(l.img||ph(l))}" alt="${esc(l.name)}" loading="lazy"><span class="vf">✓ Verified</span><div class="ov"><h3>${esc(l.name)}, ${+l.age}</h3><p>${esc(l.city)}</p></div></div><div class="pb"><div class="tg"><span>${esc(l.tag)}</span></div><p>${esc(l.bio)}</p><button class="btn" onclick="ask('${l.id}')">Chat</button></div></article>`).join('')||'<p class="mu">No ladies are available right now. Please check back soon.</p>'}</div>`}
function ask(id){want=id;$('dn').textContent=lname(id);$('ok').checked=false;$('de').textContent='';dlg.showModal();if(cfg.ts&&window.turnstile){tsid!==undefined?turnstile.reset(tsid):tsid=turnstile.render('#ts',{sitekey:cfg.ts,callback:t=>tk=t})}}
async function go(){if(!$('ok').checked){$('de').textContent='Please confirm to continue.';return}
 if(sb){
  if(!uidv){const {data,error}=await sb.auth.signInAnonymously(tk?{options:{captchaToken:tk}}:undefined);if(error){$('de').textContent=error.message;return}uidv=data.user.id;tk=''}
  let {data:c}=await sb.from('conversations').select('id').eq('listing_id',want).eq('client_id',uidv).maybeSingle();
  if(!c){const r=await sb.from('conversations').insert({client_id:uidv,listing_id:want,disclosure_accepted_at:now()}).select('id').single();if(r.error){$('de').textContent=r.error.message;return}c=r.data}
  live();await ld();dlg.close();location.hash='#/chat/'+c.id;return}
 let c=S.c.find(x=>x.cid==me&&x.lid==want);
 if(!c){c={id:uid(),cid:me,lid:want,st:'open'};S.c.push(c);
  S.m.push({id:uid(),c:c.id,r:'concierge',t:Date.now(),b:`Hi, thanks for your interest in ${lname(want)}. You’re chatting with the Midnightaffair concierge team. Tell us a little about yourself and what you’re looking for, and we’ll arrange an introduction.`});sv()}
 dlg.close();location.hash='#/chat/'+c.id}
/* ---- chat ---- */
function chat(id){const c=S.c.find(x=>x.id==id);if(!c||(!sb&&c.cid!=me)){location.hash='#/';return}
$('app').innerHTML=`<a href="#/">← All ladies</a><h2 style="margin-top:10px">${esc(lname(c.lid))}</h2>
<div class="note">You’re chatting with the agency concierge team, who reply on ${esc(lname(c.lid))}’s behalf and will arrange your introduction.</div>
<div class="thread" id="th"></div><div class="send"><input id="in" placeholder="Write a message" maxlength="2000" onkeydown="event.key=='Enter'&&send('${id}','client')"><button class="btn" onclick="send('${id}','client')">Send</button></div>`;msgs(id)}
function msgs(id,box='th',mine='client'){const th=$(box);if(!th)return;const c=S.c.find(x=>x.id==id)||{};
th.innerHTML=S.m.filter(m=>m.c==id).map(m=>`<div class="b ${m.r==mine?'me':''} ${m.r=='concierge'?'ag':''}"><small>${m.r=='client'?(mine=='client'?'You':esc(c.cid)):'Agency concierge'} · ${tm(m.t)}</small>${esc(m.b)}</div>`).join('');th.scrollTop=th.scrollHeight}
async function send(id,r){const i=$('in'),b=i.value.trim();if(!b)return;i.value='';
 if(sb){const {error}=await sb.from('messages').insert({conversation_id:id,sender_role:r,sender_user:uidv,body:b.slice(0,2000)});if(error){alert('Message not sent: '+error.message);return}await ld()}
 else{S.m.push({id:uid(),c:id,r,b:b.slice(0,2000),t:Date.now()});sv()}
 msgs(id,r=='client'?'th':'thm',r)}
/* ---- admin ---- */
function admin(){if(!adm){$('app').innerHTML=`<h2>Admin sign in</h2><div style="display:grid;gap:8px;max-width:320px">${sb?'<input id="em" type="email" placeholder="Admin email" autocomplete="username">':''}<input id="pin" type="password" placeholder="${sb?'Password':'PIN'}" autocomplete="current-password" onkeydown="event.key=='Enter'&&login()"><button class="btn" onclick="login()">Sign in</button></div><p id="pe" class="mu"></p>`;return}
$('app').innerHTML=`<div class="tabs"><button class="btn sm ghost ${tab=='in'?'on':''}" onclick="tab='in';admin()">Inbox</button><button class="btn sm ghost ${tab=='ls'?'on':''}" onclick="tab='ls';admin()">Listings</button><button class="btn sm ghost" onclick="logout()">Sign out</button></div><div id="pane"></div>`;
tab=='in'?inbox():lists()}
async function login(){
 if(sb){const {data,error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pin').value});if(error){$('pe').textContent=error.message;return}
  const {data:a}=await sb.from('admins').select('user_id').maybeSingle();if(!a){await sb.auth.signOut();$('pe').textContent='This account is not an admin.';return}
  uidv=data.user.id;adm=1;live();await ld();admin();return}
 if($('pin').value==PIN){adm=1;try{sessionStorage.setItem('ml:adm','1')}catch(e){}admin()}else $('pe').textContent='Wrong PIN.'}
async function logout(){if(sb){await sb.auth.signOut();uidv=null;if(ch){sb.removeChannel(ch);ch=null}}adm=0;try{sessionStorage.removeItem('ml:adm')}catch(e){}await ld();admin()}
function inbox(){$('pane').innerHTML=`<div class="inbox"><div id="list"></div><div id="thr"></div></div>`;lst();pick(sel)}
function lst(){const cs=[...S.c].sort((a,b)=>((last(b)||{}).t||0)-((last(a)||{}).t||0));
$('list').innerHTML=cs.map(c=>`<button class="li ${c.id==sel?'sel':''}" onclick="pick('${c.id}')"><b>${esc(lname(c.lid))}</b> <span class="chip">${c.st}</span><small>${esc(c.cid)}</small><small>${esc(((last(c)||{}).b||'').slice(0,40))}</small></button>`).join('')||'<p class="mu">No conversations yet.</p>'}
function pick(id){sel=id;const c=S.c.find(x=>x.id==id);if(!$('thr'))return;lst();
if(!c){$('thr').innerHTML='<p class="mu">Select a conversation.</p>';return}
$('thr').innerHTML=`<div class="tabs"><b style="align-self:center">${esc(lname(c.lid))} · ${esc(c.cid)}</b>${['open','booked','flagged','closed','blocked'].map(s=>`<button class="btn sm ghost ${c.st==s?'on':''}" onclick="setSt('${s}')">${s}</button>`).join('')}</div><div class="thread" id="thm"></div><div class="send"><input id="in" placeholder="Reply as concierge" maxlength="2000" onkeydown="event.key=='Enter'&&send('${id}','concierge')"><button class="btn" onclick="send('${id}','concierge')">Send</button></div>`;msgs(id,'thm','concierge')}
async function setSt(s){S.c.find(x=>x.id==sel).st=s;if(sb){await sb.from('conversations').update({status:s}).eq('id',sel);await ld()}else sv();pick(sel)}
function lists(){$('pane').innerHTML=`<form class="add" onsubmit="addL(event)"><input name="n" placeholder="Name" required><input name="a" type="number" min="18" placeholder="Age (18+)" required><input name="c" placeholder="City" required><input name="t" placeholder="Relationship / Hookup" required><textarea name="b" placeholder="Short bio" rows="2"></textarea><input name="p" type="file" accept="image/*"><button class="btn">Add as draft</button></form>
